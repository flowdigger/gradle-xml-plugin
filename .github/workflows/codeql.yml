name: CodeQL

on:
  push:
    branches: ["main", "release/**"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (Java)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ["java"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Ensure composite build dependencies are available
        shell: bash
        run: |
          set -euo pipefail
          ROOT_PARENT="$(dirname "$GITHUB_WORKSPACE")"
          OWNER="${GITHUB_REPOSITORY_OWNER}"

          clone_if_referenced() {
            local includeExpr="$1"
            local repoName="$2"
            if ! grep -R -q "$includeExpr" settings.gradle* 2>/dev/null; then
              return 0
            fi
            if [ -d "$ROOT_PARENT/$repoName/.git" ]; then
              return 0
            fi
            if git clone --depth 1 "https://github.com/$OWNER/$repoName.git" "$ROOT_PARENT/$repoName"; then
              return 0
            fi
            git clone --depth 1 "https://github.com/flowdigger/$repoName.git" "$ROOT_PARENT/$repoName"
          }

          clone_if_referenced 'includeBuild("../flowdigger-gradle")\|includeBuild('\''../flowdigger-gradle'\'')' flowdigger-gradle
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
