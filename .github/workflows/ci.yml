name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Ensure composite build dependencies are available
        shell: bash
        run: |
          set -euo pipefail
          ROOT_PARENT="$(dirname "$GITHUB_WORKSPACE")"
          OWNER="${GITHUB_REPOSITORY_OWNER}"

          clone_if_referenced() {
            local includeExpr="$1"
            local repoName="$2"
            if ! grep -R -q "$includeExpr" settings.gradle* 2>/dev/null; then
              return 0
            fi
            if [ -d "$ROOT_PARENT/$repoName/.git" ]; then
              return 0
            fi
            if git clone --depth 1 "https://github.com/$OWNER/$repoName.git" "$ROOT_PARENT/$repoName"; then
              return 0
            fi
            git clone --depth 1 "https://github.com/flowdigger/$repoName.git" "$ROOT_PARENT/$repoName"
          }

          clone_if_referenced 'includeBuild("../gradle-antlr-plugin")\|includeBuild('\''../gradle-antlr-plugin'\'')' gradle-antlr-plugin
          clone_if_referenced 'includeBuild("../gradle-antlr-parse-plugin")\|includeBuild('\''../gradle-antlr-parse-plugin'\'')' gradle-antlr-parse-plugin

      - name: Run checks
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace clean check spotbugsMain
