name: Release to Maven Central

on:
  workflow_dispatch:
  push:
    branches:
      - 'release/**'
    tags:
      - 'v*'

jobs:
  verify-release-branch:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make wrapper executable
        run: chmod +x ./gradlew

      - name: Verify release branch build
        run: ./gradlew clean test --stacktrace --no-daemon

  publish:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make wrapper executable
        run: chmod +x ./gradlew

      - name: Publish artifacts to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          set -euo pipefail
          for v in ORG_GRADLE_PROJECT_mavenCentralUsername ORG_GRADLE_PROJECT_mavenCentralPassword; do
            if [ -z "${!v:-}" ]; then
              echo "Required secret missing: $v"
              exit 1
            fi
          done
          ./gradlew clean publishAllPublicationsToCentralRepository --stacktrace --no-daemon --info | tee publish.log

      - name: Upload publish log
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: publish-log-${{ github.run_id }}
          path: publish.log
          if-no-files-found: warn
